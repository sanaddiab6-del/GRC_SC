name: Build Amro Frontend

on:
  push:
    branches:
      - test/amro-cloud-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: grc-amro-frontend:test
          outputs: type=docker,dest=/tmp/amro-frontend.tar

      - name: Compress image
        run: gzip -1 /tmp/amro-frontend.tar

      - name: Upload finished image
        uses: actions/upload-artifact@v4
        with:
          name: amro-frontend-image
          path: /tmp/amro-frontend.tar.gz
          retention-days: 1
