name: Build Colleague Docker Images

on:
  push:
    branches:
      - test/colleague-docker-1206211

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1206211d6ffa77c29d1a26f6f8cdd66084bad2b4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          tags: sico-colleague-cloud-${{ matrix.component }}:1206211
          build-args: NODE_OPTIONS=--max-old-space-size=5120
          outputs: type=docker,dest=/tmp/${{ matrix.component }}.tar

      - run: gzip -1 /tmp/${{ matrix.component }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: colleague-${{ matrix.component }}-1206211
          path: /tmp/${{ matrix.component }}.tar.gz
          retention-days: 3
          compression-level: 0
