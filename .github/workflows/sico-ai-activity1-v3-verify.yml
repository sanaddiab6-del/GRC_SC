name: SICO AI Activity 1 v3 - Frontend Build Verification
on:
  push:
    branches:
      - feature/sico-ai-audit-risk-v1
    paths:
      - 'frontend/src/routes/(app)/(internal)/sico-ai-next/**'
      - 'frontend/src/lib/utils/sicoFrameworkReviewV3.ts'
      - 'backend/ai_onboarding/sico_ai_sixteen_generate_views.py'
      - 'backend/ai_onboarding/sico_ai_framework_batch_v3.py'
      - '.github/workflows/sico-ai-activity1-v3-verify.yml'

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NODE_OPTIONS: '--max-old-space-size=4096'
      PUBLIC_BACKEND_API_URL: 'foo'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Paraglide source
        working-directory: frontend
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide
      - name: Sync SvelteKit
        working-directory: frontend
        run: pnpm exec svelte-kit sync
      - name: Check Svelte and TypeScript
        working-directory: frontend
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json
      - name: Build complete frontend
        working-directory: frontend
        run: pnpm exec vite build