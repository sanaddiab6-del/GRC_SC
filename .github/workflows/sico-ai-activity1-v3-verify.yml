name: SICO AI Activity 1 v3 - Frontend Build Verification
on:
  push:
    branches:
      - feature/sico-ai-audit-risk-v1

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NODE_OPTIONS: '--max-old-space-size=6144'
      PUBLIC_BACKEND_API_URL: 'foo'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Paraglide source
        working-directory: frontend
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide
      - name: Sync SvelteKit
        working-directory: frontend
        run: pnpm exec svelte-kit sync
      # Report-only: the codebase has a large pre-existing backlog of svelte-check
      # type errors that do not affect the production build. Results stay visible
      # in the logs; the Vite build below is the blocking verification.
      - name: Check Svelte and TypeScript (report-only)
        working-directory: frontend
        continue-on-error: true
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json --output human
      - name: Build complete frontend
        working-directory: frontend
        run: pnpm exec vite build